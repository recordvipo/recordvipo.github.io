<!doctype html>
<html lang="vi">
	
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Vipo Media</title>
	<link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar ul {
            list-style: none;
            display: flex;
        }
        .navbar ul li {
            margin: 0 15px;
        }
        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
		
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

body {
    background-color: #121212;
    color: #fff;
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding-bottom: 50px;
}


.vfx-header {
    padding: 60px 0 30px 0;
}

.vfx-title {
    font-size: clamp(5rem, 18vw, 12rem);
    font-weight: 900;
    line-height: 0.8;
    margin: 0;
    letter-spacing: -5px;
}


.vfx-box {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background-color: #111;
    cursor: pointer;
}

.vfx-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.4s ease-in-out;
}


.vfx-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0; 
    transition: 0.3s ease;
}

.vfx-box:hover .vfx-overlay {
    opacity: 1; 
}

.vfx-box:hover img {
    transform: scale(1.05);
}

.vfx-text {
    font-size: 0.8rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;

    padding-bottom: 4px;
}
.vfx-title {
    animation: fadeInUp 1.2s ease-out forwards;
    opacity: 0;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.vfx-text {
    font-size: 0.8rem;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    
    opacity: 0;
    transform: translateY(20px);
    
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.vfx-box:hover .vfx-text {
    opacity: 1;
    transform: translateY(0);
}

.vfx-box {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden; 
    background-color: #111;
    cursor: pointer;
    transition: transform 0.3s ease;  
    border-radius: 20px; 
}


.vfx-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px; 
    transition: 0.4s ease-in-out;
}

/* Container chính của Nav */
.vipo-nav {
    background-color: #121212;
    padding: 20px 40px;
	


}
/* Container lớp phủ */
.vfx-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column; /* Xếp dọc: Tiêu đề trên, Subtitle dưới */
    align-items: center;    /* Canh giữa theo chiều ngang */
    justify-content: center; /* Canh giữa theo chiều dọc */
    opacity: 0;
    transition: opacity 0.4s ease;
    padding: 20px;
}

/* Tiêu đề chính: Bự và dõng dạc */
.vfx-title-main {
    font-size: 1.2rem; /* Cỡ chữ lớn */
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 5px; /* Khoảng cách nhỏ với dòng dưới */
    transform: translateY(20px);
    transition: all 0.5s ease;
    text-align: center;
}

/* Dòng phụ (Credit): Nhỏ và thanh mảnh */
.vfx-subtitle {
    font-size: 0.7rem; /* Cỡ chữ nhỏ như cũ */
    font-weight: 400;
    letter-spacing: 4px;
    opacity: 0.8;
    transform: translateY(20px);
    transition: all 0.5s ease 0.1s; /* Có độ trễ 0.1s cho mượt */
}

/* Animation khi Hover vào Box tổng */
.vfx-box:hover .vfx-overlay {
    opacity: 1;
}

.vfx-box:hover .vfx-title-main,
.vfx-box:hover .vfx-subtitle {
    transform: translateY(0); /* Bay lên vị trí chuẩn */
}
.nav-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Brand Name */
.brand-name {
    color: #fff;
    text-decoration: none;
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: -1px;
}

/* Menu Container */
.menu-container {
    position: relative;
    padding: 10px;
    cursor: pointer;
}

/* Vẽ Icon 3 gạch (Hamburger) */
.menu-icon .bar {
    width: 25px;
    height: 2px;
    background-color: #fff;
    margin: 5px 0;
    transition: 0.3s;
}

/* Dropdown Menu - Mặc định ẩn */
.dropdown-content {
    position: absolute;
    top: 100%;
    right: 0;
    background-color: #1a1a1a;
    min-width: 200px;
    list-style: none;
    padding: 10px 0;
    margin: 0;
    border-radius: 10px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: all 0.3s ease;
    z-index: 1000;
}

.dropdown-content li a {
    color: #fff;
    padding: 12px 20px;
    text-decoration: none;
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1px;
}

.dropdown-content li a:hover {
    background-color: #333;
    color: #fff;
}

/* KỸ THUẬT QUAN TRỌNG: Rê chuột vào container thì hiện dropdown */
.menu-container:hover .dropdown-content {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

/* Hiệu ứng nhẹ cho icon khi hover */
.menu-container:hover .bar:nth-child(2) {
    width: 15px; /* Làm gạch giữa ngắn lại cho điệu */
}

a {
    color: inherit !important;      /* Lấy màu từ thẻ cha (thẻ div hoặc body) */
    text-decoration: none !important; /* Bỏ gạch chân hoàn toàn */
}

/* Đảm bảo khi di chuột vào link nó cũng không hiện xanh */
a:hover, a:active, a:focus {
    color: inherit !important;
    text-decoration: none !important;
}

/* Section tổng */
.feature-video-section {
    padding: 80px 0;
    background-color: #000;
}

/* Style cho tiêu đề H3 */
.video-section-title {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 5px;
    margin-bottom: 40px;
    color: #fff;
    text-transform: uppercase;
}


/* Kỹ thuật Responsive Video 16:9 */
.vimeo-wrapper {
    position: relative;
    padding-bottom: 56.25%; /* Tỷ lệ 16:9 */
    height: 0;
    overflow: hidden;
    max-width: 1000px; /* Ba có thể chỉnh độ rộng video ở đây */
    margin: 0 auto;
    border-radius: 20px; /* Bo góc cho đồng bộ với các box dưới */
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.vimeo-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}


.hero-video {
    position: relative;
    width: 100%;
    height: 100vh; 
    overflow: hidden;
    background-color: #000;
}

.vimeo-full-wrapper iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
}

/* Fix tỷ lệ để video luôn phủ kín (tương tự background-size: cover) */
@media (min-aspect-ratio: 16/9) {
    .vimeo-full-wrapper iframe {
        height: 56.25vw;
    }
}
@media (max-aspect-ratio: 16/9) {
    .vimeo-full-wrapper iframe {
        width: 177.78vh;
    }
}


    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay loop muted>
            <source src="video/VipoShowreel1724.mp4" type="video/mp4">
            
        </video>
		<div class="hero-footer-copyright">
        <p>© 2026 | VIPO.MEDIA</p>
    	</div>
    </div>
	
    <nav class="vipo-nav">
			<div class="nav-wrapper">
				<a href="#" class="brand-name">VIPO.MEDIA</a>

				<div class="menu-container">
					<div class="menu-icon">
						<div class="bar"></div>
						<div class="bar"></div>
						<div class="bar"></div>
					</div>

					<ul class="dropdown-content">						
						<li><a href="portfolio.html">MY PORTFOLIO</a></li>
						<li><a href="#vfx">WIP</a></li>
						<li><a href="#contact">CONTACT</a></li>
					</ul>
				</div>
			</div>
		</nav>
</body>
</html>
